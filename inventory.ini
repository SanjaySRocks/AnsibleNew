# Purpose: Example inventory for one Linux server and two Windows environment servers.
# Replace hostnames/IPs and credentials with your environment-specific values.

[linux]
ithem_server ansible_host=192.0.2.10 ansible_user=ubuntu ansible_become=true

[windows_dev]
dev_env_server ansible_host=192.0.2.20

[windows_uat]
uat_env_server ansible_host=192.0.2.30

[windows:children]
windows_dev
windows_uat

[windows:vars]
# Windows hosts use WinRM. Prefer Ansible Vault for real credentials.
ansible_connection=winrm
ansible_port=5986
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_user=Administrator
ansible_password=ChangeMeUseAnsibleVault

[all:vars]
# Common defaults; override per host/group as needed.
ansible_python_interpreter=auto_silent
